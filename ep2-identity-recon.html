<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EP 02 · Identity Recon — 3D Digital Inbox Perimeter Lockdown</title>
  <meta name="description" content="10-second 3D looping animation of an open digital inbox undergoing automated reconnaissance and targeted perimeter lockdown.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0B111A;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Outer Stage centering the 9:16 vertical viewport */
    #viewport-stage {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      aspect-ratio: 9 / 16;
      background: linear-gradient(180deg, #F4F6F9 0%, #E9EDF4 50%, #DDE3ED 100%);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 3D Canvas element */
    #canvas3d {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      outline: none;
    }

    /* Frosted-glass Card Overlay (top) */
    .hud-overlay {
      position: absolute;
      top: 24px;
      left: 20px;
      right: 20px;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-overlay.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: 0 16px 36px -10px rgba(15, 23, 42, 0.14),
                  0 0 0 1px rgba(255, 255, 255, 0.5) inset;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      padding-bottom: 10px;
    }

    .card-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #EA580C;
    }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.02em;
    }

    .badge-live {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      border: 1px solid rgba(234, 88, 12, 0.25);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 700;
      color: #EA580C;
      box-shadow: 0 2px 6px rgba(234, 88, 12, 0.1);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #EA580C;
      box-shadow: 0 0 8px #EA580C;
      animation: pulse-live 1.2s infinite ease-in-out;
    }

    @keyframes pulse-live {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    /* Status Bar Row */
    .status-row {
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(241, 245, 249, 0.85);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 14px;
      border: 1px solid rgba(203, 213, 225, 0.5);
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EA580C;
      box-shadow: 0 0 8px #EA580C;
      transition: background-color 0.35s ease, box-shadow 0.35s ease;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 12px;
      font-weight: 600;
      color: #1E293B;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Metric Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.85);
      border-radius: 12px;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748B;
      line-height: 1.1;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #0F172A;
      line-height: 1.2;
    }

    .stat-bar-bg {
      width: 100%;
      height: 4px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 2px;
    }

    .stat-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #EA580C, #F97316);
      border-radius: 999px;
      transition: width 0.15s linear;
    }

    /* Interactive Bottom Bar (Discreet controls) */
    .hud-bottom {
      position: absolute;
      bottom: 16px;
      left: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      opacity: 0.88;
      transition: opacity 0.2s;
    }

    .hud-bottom:hover {
      opacity: 1;
    }

    .timeline-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .play-btn {
      background: #EA580C;
      border: none;
      color: #FFFFFF;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      transition: transform 0.15s ease, background 0.15s ease;
      flex-shrink: 0;
    }

    .play-btn:hover {
      background: #C2410C;
      transform: scale(1.06);
    }

    .time-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      min-width: 44px;
    }

    .loop-track {
      flex: 1;
      height: 4px;
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .loop-progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: #EA580C;
      border-radius: 999px;
    }

    .hud-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748B;
      white-space: nowrap;
    }

    /* Top series tag */
    .top-badge-link {
      position: absolute;
      top: 8px;
      right: 22px;
      font-size: 10px;
      font-weight: 700;
      color: #EA580C;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.8);
      padding: 3px 8px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
      z-index: 11;
      pointer-events: auto;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    /* Embedded Mode (inside card thumbnail or hero) */
    html.is-embedded,
    body.is-embedded {
      background: #EFF6FF !important;
      display: block !important;
      width: 100% !important;
      height: 100% !important;
    }

    body.is-embedded #viewport-stage {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      aspect-ratio: auto !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      background: #EFF6FF !important;
    }

    body.is-embedded .top-badge-link,
    body.is-embedded .hud-bottom,
    body.is-embedded .hud-overlay {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="viewport-stage">
    <!-- Link back to Episode 02 Article -->
    <a href="article-02.html" class="top-badge-link" title="Open Article Ep 02">← Back to Article</a>

    <!-- Frosted-glass Card Overlay -->
    <div class="hud-overlay" id="hudCard">
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title-group">
            <span class="card-eyebrow">Perimeter Defence & OSINT</span>
            <h1 class="card-title">EP 02 · Identity Recon</h1>
          </div>
          <div class="badge-live">
            <div class="live-dot" id="liveDot"></div>
            <span>SURVEILLANCE</span>
          </div>
        </div>

        <div class="status-row">
          <div class="status-indicator" id="statusDot"></div>
          <div class="status-text" id="statusText">Monitoring the inbox</div>
        </div>

        <div class="stats-grid">
          <!-- Stat 1: Credential Stuffing -->
          <div class="stat-card">
            <span class="stat-label">Credential Stuffing</span>
            <span class="stat-value" id="valStuffing">Dormant</span>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" id="barStuffing"></div>
            </div>
          </div>

          <!-- Stat 2: Crawlers Intercepted -->
          <div class="stat-card">
            <span class="stat-label">Crawlers Intercepted</span>
            <span class="stat-value" id="valCrawlers">0</span>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" id="barCrawlers"></div>
            </div>
          </div>

          <!-- Stat 3: Perimeter -->
          <div class="stat-card">
            <span class="stat-label">Perimeter</span>
            <span class="stat-value" id="valPerimeter">Exposed</span>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" id="barPerimeter"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3D Canvas -->
    <canvas id="canvas3d"></canvas>

    <!-- Bottom Control Scrub Bar -->
    <div class="hud-bottom">
      <button class="play-btn" id="playBtn" aria-label="Toggle Play/Pause">⏸</button>
      <div class="timeline-wrap">
        <span class="time-readout" id="timeReadout">0.0s</span>
        <div class="loop-track">
          <div class="loop-progress" id="loopProgress"></div>
        </div>
        <span class="time-readout">10.0s</span>
      </div>
      <span class="hud-tag">9:16 3D</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // 10-Second Looping Animation Constants
    const RENDER_WIDTH = 1080;
    const RENDER_HEIGHT = 1920;
    const LOOP_DURATION = 10.0;

    // Palette Definition: Off-white, clean white, slate blue and charcoal, with vivid dark orange
    const COLOR_WHITE = 0xFFFFFF;
    const COLOR_SLATE_BLUE = 0x2D4F7C;
    const COLOR_SLATE_LIGHT = 0x476A9C;
    const COLOR_CHARCOAL = 0x1E293B;
    const COLOR_CHARCOAL_DARK = 0x0F172A;
    const COLOR_SOFT_GRAY = 0x94A3B8;
    const COLOR_VIVID_ORANGE = 0xEA580C;
    const COLOR_ORANGE_CORE = 0xC2410C;
    const COLOR_CYAN_DOT = 0x38BDF8;

    // URL parameters for embed mode (?embed=card or ?embed=hero)
    const urlParams = new URLSearchParams(window.location.search);
    const isEmbedded = urlParams.has('embed');
    const embedMode = urlParams.get('embed') || (isEmbedded ? 'card' : '');
    if (isEmbedded) {
      document.documentElement.classList.add('is-embedded');
      document.body.classList.add('is-embedded');
      if (embedMode) document.body.classList.add('mode-' + embedMode);
    }

    // Materials (MeshStandardMaterial throughout)
    const matWhite = new THREE.MeshStandardMaterial({
      color: COLOR_WHITE,
      roughness: 0.28,
      metalness: 0.05
    });

    const matSlateBlue = new THREE.MeshStandardMaterial({
      color: COLOR_SLATE_BLUE,
      roughness: 0.35,
      metalness: 0.15
    });

    const matSlateLight = new THREE.MeshStandardMaterial({
      color: COLOR_SLATE_LIGHT,
      roughness: 0.32,
      metalness: 0.1
    });

    const matCharcoal = new THREE.MeshStandardMaterial({
      color: COLOR_CHARCOAL,
      roughness: 0.45,
      metalness: 0.2
    });

    const matCharcoalDark = new THREE.MeshStandardMaterial({
      color: COLOR_CHARCOAL_DARK,
      roughness: 0.5,
      metalness: 0.25
    });

    // Vivid dark orange used ONLY for crosshair, reticle, laser, and LEAK tag
    const matVividOrange = new THREE.MeshStandardMaterial({
      color: COLOR_VIVID_ORANGE,
      emissive: COLOR_ORANGE_CORE,
      emissiveIntensity: 0.6,
      roughness: 0.25,
      metalness: 0.15
    });

    const matOrangeGlow = new THREE.MeshStandardMaterial({
      color: COLOR_VIVID_ORANGE,
      emissive: COLOR_VIVID_ORANGE,
      emissiveIntensity: 2.2,
      roughness: 0.1
    });

    const matLaserLine = new THREE.MeshStandardMaterial({
      color: COLOR_VIVID_ORANGE,
      emissive: COLOR_VIVID_ORANGE,
      emissiveIntensity: 3.0,
      transparent: true,
      opacity: 0.85
    });

    const matPocketGlow = new THREE.MeshStandardMaterial({
      color: 0x93C5FD,
      emissive: 0x60A5FA,
      emissiveIntensity: 1.8,
      roughness: 0.2
    });

    const matWhiteEye = new THREE.MeshStandardMaterial({
      color: COLOR_WHITE,
      emissive: COLOR_WHITE,
      emissiveIntensity: 1.8,
      roughness: 0.1
    });

    const matDataDotWhite = new THREE.MeshStandardMaterial({
      color: COLOR_WHITE,
      emissive: COLOR_WHITE,
      emissiveIntensity: 1.2,
      roughness: 0.2
    });

    const matDataDotBlue = new THREE.MeshStandardMaterial({
      color: COLOR_CYAN_DOT,
      emissive: COLOR_CYAN_DOT,
      emissiveIntensity: 1.5,
      roughness: 0.2
    });

    const matShockwave = new THREE.MeshStandardMaterial({
      color: COLOR_WHITE,
      emissive: 0x93C5FD,
      emissiveIntensity: 1.5,
      transparent: true,
      opacity: 0.0,
      roughness: 0.2
    });

    // Setup Renderer
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(RENDER_WIDTH, RENDER_HEIGHT, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.16;

    // Scene
    const scene = new THREE.Scene();
    if (isEmbedded) {
      scene.background = new THREE.Color(0xEFF6FF);
    } else {
      scene.background = new THREE.Color(0xF4F6F9);
    }

    // Camera: Isometric perspective
    const camera = new THREE.PerspectiveCamera(31, RENDER_WIDTH / RENDER_HEIGHT, 0.1, 100);
    if (!isEmbedded) {
      // Shift diorama below the card using camera view offset
      camera.setViewOffset(RENDER_WIDTH, RENDER_HEIGHT, 0, -250, RENDER_WIDTH, RENDER_HEIGHT);
    }

    // Directional Sun with soft shadows + Hemisphere bounce
    const dirSun = new THREE.DirectionalLight(0xFFFFFF, 2.3);
    dirSun.position.set(14, 25, 12);
    dirSun.castShadow = true;
    dirSun.shadow.mapSize.width = 2048;
    dirSun.shadow.mapSize.height = 2048;
    dirSun.shadow.camera.near = 5;
    dirSun.shadow.camera.far = 50;
    const dSize = 8.0;
    dirSun.shadow.camera.left = -dSize;
    dirSun.shadow.camera.right = dSize;
    dirSun.shadow.camera.top = dSize;
    dirSun.shadow.camera.bottom = -dSize;
    dirSun.shadow.bias = -0.0004;
    dirSun.shadow.normalBias = 0.02;
    scene.add(dirSun);

    const hemiLight = new THREE.HemisphereLight(0xFFFFFF, 0xCBD5E1, 0.95);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const fillLight = new THREE.DirectionalLight(0x94A3B8, 0.5);
    fillLight.position.set(-12, 10, -10);
    scene.add(fillLight);

    // Post-Processing Pipeline: EffectComposer -> RenderPass -> GTAOPass -> OutputPass
    let composer = null;
    try {
      composer = new EffectComposer(renderer);
      const renderPass = new RenderPass(scene, camera);
      composer.addPass(renderPass);

      const gtaoPass = new GTAOPass(scene, camera, RENDER_WIDTH, RENDER_HEIGHT);
      if (gtaoPass.updateGtaoMaterial) {
        gtaoPass.updateGtaoMaterial({
          radius: 0.42,
          distanceExponent: 1.1,
          thickness: 1.2,
          scale: 1.0,
          samples: 16
        });
      }
      composer.addPass(gtaoPass);

      const outputPass = new OutputPass();
      composer.addPass(outputPass);
    } catch (err) {
      console.warn('GTAOPass fallback to standard render:', err);
      composer = null;
    }

    // Shadow Catcher Plane under floating diorama
    const shadowGeo = new THREE.PlaneGeometry(35, 35);
    const shadowMat = new THREE.ShadowMaterial({ opacity: 0.16 });
    const shadowCatcher = new THREE.Mesh(shadowGeo, shadowMat);
    shadowCatcher.rotation.x = -Math.PI / 2;
    shadowCatcher.position.y = -0.92;
    shadowCatcher.receiveShadow = true;
    scene.add(shadowCatcher);

    // Root Diorama Group
    const dioramaGroup = new THREE.Group();
    scene.add(dioramaGroup);

    // -------------------------------------------------------------
    // 1. LAYERED ROUNDED SLAB (White top, Slate blue middle, Charcoal base)
    // -------------------------------------------------------------
    const slabGroup = new THREE.Group();
    dioramaGroup.add(slabGroup);

    // Charcoal Base Layer
    const slabBaseGeo = new RoundedBoxGeometry(7.8, 0.34, 7.8, 3, 0.22);
    const slabBase = new THREE.Mesh(slabBaseGeo, matCharcoal);
    slabBase.position.y = -0.52;
    slabBase.castShadow = true;
    slabBase.receiveShadow = true;
    slabGroup.add(slabBase);

    // Slate Blue Middle Layer
    const slabMidGeo = new RoundedBoxGeometry(7.4, 0.28, 7.4, 3, 0.18);
    const slabMid = new THREE.Mesh(slabMidGeo, matSlateBlue);
    slabMid.position.y = -0.21;
    slabMid.castShadow = true;
    slabMid.receiveShadow = true;
    slabGroup.add(slabMid);

    // White Top Layer
    const slabTopGeo = new RoundedBoxGeometry(7.0, 0.28, 7.0, 3, 0.16);
    const slabTop = new THREE.Mesh(slabTopGeo, matWhite);
    slabTop.position.y = 0.07;
    slabTop.castShadow = true;
    slabTop.receiveShadow = true;
    slabGroup.add(slabTop);

    // Slab surface sits at y = 0.21

    // -------------------------------------------------------------
    // 2. LARGE WHITE POSTAL ENVELOPE IN CHARCOAL CRADLE
    // -------------------------------------------------------------
    const envelopeGroup = new THREE.Group();
    envelopeGroup.position.set(-0.35, 0.21, -0.7);
    dioramaGroup.add(envelopeGroup);

    // Charcoal Cradle Base
    const cradleBaseGeo = new RoundedBoxGeometry(3.6, 0.22, 1.1, 2, 0.05);
    const cradleBase = new THREE.Mesh(cradleBaseGeo, matCharcoalDark);
    cradleBase.position.set(0, 0.11, 0);
    cradleBase.castShadow = true;
    cradleBase.receiveShadow = true;
    envelopeGroup.add(cradleBase);

    // Cradle Side Supports
    const supGeo = new RoundedBoxGeometry(0.24, 0.6, 0.9, 2, 0.04);
    const supL = new THREE.Mesh(supGeo, matCharcoalDark);
    supL.position.set(-1.68, 0.35, 0);
    supL.castShadow = true;
    envelopeGroup.add(supL);

    const supR = new THREE.Mesh(supGeo, matCharcoalDark);
    supR.position.set(1.68, 0.35, 0);
    supR.castShadow = true;
    envelopeGroup.add(supR);

    // Envelope Body (Clean White)
    const envBodyGeo = new RoundedBoxGeometry(3.2, 2.3, 0.22, 2, 0.06);
    const envBody = new THREE.Mesh(envBodyGeo, matWhite);
    envBody.position.set(0, 1.35, 0);
    envBody.castShadow = true;
    envBody.receiveShadow = true;
    envelopeGroup.add(envBody);

    // Thin Slate Seam Lines on envelope face
    const seamGeo = new RoundedBoxGeometry(1.6, 0.03, 0.02, 2, 0.005);
    const seamL = new THREE.Mesh(seamGeo, matSlateBlue);
    seamL.position.set(-0.7, 0.85, 0.12);
    seamL.rotation.z = Math.PI / 6.5;
    envelopeGroup.add(seamL);

    const seamR = new THREE.Mesh(seamGeo, matSlateBlue);
    seamR.position.set(0.7, 0.85, 0.12);
    seamR.rotation.z = -Math.PI / 6.5;
    envelopeGroup.add(seamR);

    // Glowing Fold Line along the hinge

    function easeOutBack(x, c1 = 1.70158) {
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    function easeInBack(x, c1 = 1.70158) {
      const c3 = c1 + 1;
      return c3 * x * x * x - c1 * x * x;
    }

    function easeOutBounce(x) {
      const n1 = 7.5625;
      const d1 = 2.75;
      if (x < 1 / d1) {
        return n1 * x * x;
      } else if (x < 2 / d1) {
        return n1 * (x -= 1.5 / d1) * x + 0.75;
      } else if (x < 2.5 / d1) {
        return n1 * (x -= 2.25 / d1) * x + 0.9375;
      } else {
        return n1 * (x -= 2.625 / d1) * x + 0.984375;
      }
    }

      if (isPlaying) {

      const t = totalTime % LOOP_DURATION;

      // Update UI readouts

      // -----------------------------------------------------------

      // -----------------------------------------------------------
      const loopPhase = (t / LOOP_DURATION) * Math.PI * 2;
      const baseAngle = Math.PI / 4;
      const orbitOffset = Math.sin(loopPhase) * (18 * Math.PI / 180);
      const camAngle = baseAngle + orbitOffset;

      const camDist = 16.5 - 1.1 * Math.sin(loopPhase);
      const camElev = 12.2 + 0.6 * Math.sin(loopPhase);

      let shakeOffsetY = 0;
      if (t >= 5.0 && t <= 5.45) {
        const shakeDecay = 1.0 - (t - 5.0) / 0.45;
        shakeOffsetX = (Math.random() - 0.5) * 0.18 * shakeDecay;
        shakeOffsetY = (Math.random() - 0.5) * 0.18 * shakeDecay;
      }

      if (isEmbedded) {

        const embedElev = 11.6;
        camera.position.set(

          embedElev + shakeOffsetY,
          Math.sin(camAngle) * embedDist
        );
        camera.lookAt(0, 1.25, 0);
      } else {
        camera.position.set(
          Math.cos(camAngle) * camDist + shakeOffsetX,
          camElev + shakeOffsetY,
          Math.sin(camAngle) * camDist
        );
        camera.lookAt(0, 1.1, 0);
      }

        statusDot.style.boxShadow = '0 0 8px #EA580C';
        statusText.textContent = 'Monitoring the inbox';

        statusDot.style.boxShadow = '0 0 10px #EA580C';
        statusText.textContent = 'Inbox exposed';

        statusDot.style.backgroundColor = '#EA580C';
        statusDot.style.boxShadow = '0 0 10px #EA580C';
        statusText.textContent = 'Crawlers mapping the inbox';
      } else if (t < 5.0) {
        statusDot.style.backgroundColor = '#EA580C';
        statusDot.style.boxShadow = '0 0 10px #EA580C';
        statusText.textContent = 'Targets tracked';
      } else {
        // Sealed!
        statusDot.style.backgroundColor = '#334E68';
        statusDot.style.boxShadow = '0 0 8px #334E68';
        statusText.textContent = 'Shield down · perimeter sealed';
      }

      // Stat 1: Credential Stuffing (types out "Active" when bots appear at 1.3–5.0s, bar empties after lockdown)
      if (t < 1.3) {
        valStuffing.textContent = 'Dormant';
        valStuffing.style.color = '#64748B';
        barStuffing.style.width = '0%';
      } else if (t >= 1.3 && t < 5.0) {
        const fullWord = 'Active';
        const prog = clamp((t - 1.3) / 0.5, 0, 1);
        const chars = Math.floor(prog * fullWord.length);
        valStuffing.textContent = fullWord.slice(0, Math.max(1, chars));
        valStuffing.style.color = '#EA580C';
        // Pulsing bar
        const pulse = Math.sin(t * 12) * 0.15 + 0.85;
        barStuffing.style.width = (pulse * 100) + '%';
        barStuffing.style.background = 'linear-gradient(90deg, #EA580C, #F97316)';
      } else {
        valStuffing.textContent = 'Neutralized';
        valStuffing.style.color = '#10B981';
        // Bar empties after lockdown
        const emptyProg = clamp(1.0 - (t - 5.0) / 0.6, 0, 1);
        barStuffing.style.width = (emptyProg * 100) + '%';
        barStuffing.style.background = '#10B981';
      }

      // Stat 2: Crawlers Intercepted (counts up from 0 to 420 when shield lands at 5.0–5.8s)
      let crawlerCount = 0;
      if (t >= 5.0 && t < 5.8) {
        const p = (t - 5.0) / 0.8;
        crawlerCount = Math.round(p * 420);
      } else if (t >= 5.8 && t < 9.2) {
        crawlerCount = 420;
      }
      valCrawlers.textContent = crawlerCount;
      barCrawlers.style.width = ((crawlerCount / 420) * 100) + '%';

      // Stat 3: Perimeter (types out "Locked" after bricks rise at 6.0–6.8s)
      if (t < 6.0) {
        valPerimeter.textContent = 'Exposed';
        valPerimeter.style.color = '#EA580C';
        barPerimeter.style.width = '20%';
      } else {
        const fullWord = 'Locked';
        const pLock = clamp((t - 6.0) / 0.6, 0, 1);
        const chars = Math.floor(pLock * fullWord.length);
        valPerimeter.textContent = fullWord.slice(0, Math.max(1, chars));
        valPerimeter.style.color = '#334E68';
        barPerimeter.style.width = (pLock * 100) + '%';
        barPerimeter.style.background = '#334E68';
      }

      // -----------------------------------------------------------
      // 3D MOTION CHOREOGRAPHY (10s LOOP)
      // -----------------------------------------------------------

      // 0–1 s: BUILD PHASE & 9.2–10 s: DISMANTLE
      let masterScale = 1.0;
      let envScale = 1.0;
      let tagScale = 1.0;
      let radarScale = 1.0;

      if (t < 1.0) {
        masterScale = easeOutBack(clamp(t / 0.7, 0, 1), 1.4);
        envScale = easeOutBack(clamp((t - 0.15) / 0.7, 0, 1), 1.5);
        tagScale = easeOutBack(clamp((t - 0.25) / 0.65, 0, 1), 1.5);
        radarScale = easeOutBack(clamp((t - 0.4) / 0.6, 0, 1), 1.4);
      } else if (t > 9.2) {
        const pOut = clamp((t - 9.2) / 0.8, 0, 1);
        const shrink = 1.0 - easeInBack(pOut, 1.4);
        masterScale = shrink;
        envScale = shrink;
        tagScale = shrink;
        radarScale = shrink;
      }

      slabGroup.scale.set(masterScale, masterScale, masterScale);
      envelopeGroup.scale.set(envScale, envScale, envScale);
      tagGroup.scale.set(tagScale, tagScale, tagScale);
      radarGroup.scale.set(radarScale, radarScale, radarScale);

      // 1–5 s: ENVELOPE FLAP UNSEALS & DATA DOTS LEAK
      if (t >= 1.0 && t < 5.0) {
        // Flap unseals slightly
        const unsealAngle = Math.sin((t - 1.0) * 1.5) * 0.15 + 0.35;
        flapPivot.rotation.x = -unsealAngle;
        matPocketGlow.emissiveIntensity = 1.8 + Math.sin(t * 8) * 0.8;
      } else {
        // Resealed flap
        flapPivot.rotation.x = 0;
        matPocketGlow.emissiveIntensity = 0.4;
      }

      // Leaking data dots
      dataDots.forEach(dot => {
        if (t >= 1.0 && t <= 5.0) {
          dot.mesh.visible = true;
          const cycleP = ((t - 1.0) * dot.driftSpeed + dot.offsetPhase) % 1.0;
          const px = -0.35 + Math.sin(cycleP * Math.PI * 4) * dot.swayX;
          const py = 2.45 + cycleP * 1.6;
          const pz = -0.6 + cycleP * 0.8;
          dot.mesh.position.set(px, py, pz);
          dot.mesh.scale.setScalar(Math.sin(cycleP * Math.PI) * 1.0);
        } else {
          dot.mesh.visible = false;
        }
      });

      // LEAK tag bobs, sways, pulses and flips over at 5.7s (padlock side), flips back at 8.6s
      const bobY = 2.2 + Math.sin(t * 3.5) * 0.08;
      const swayZ = Math.sin(t * 2.8) * 0.1;
      tagGroup.position.y = bobY;
      tagGroup.rotation.z = swayZ;

      if (t >= 5.7 && t < 8.6) {
        // Flips over to show padlock side (180° rotation)
        const flipP = clamp((t - 5.7) / 0.4, 0, 1);
        tagGroup.rotation.y = easeOutBack(flipP) * Math.PI;
      } else if (t >= 8.6) {
        // Flips back
        const flipBackP = clamp((t - 8.6) / 0.4, 0, 1);
        tagGroup.rotation.y = Math.PI - easeOutBack(flipBackP) * Math.PI;
      } else {
        tagGroup.rotation.y = 0;
      }

      // 1.3–4.5 s: BOT SPIDERS CRAWL IN TOWARD OPENING
      bots.forEach(({ group, route, legs, burstRing, index, knockDir }) => {
        if (t < 1.3) {
          group.position.copy(route.start);
          group.scale.set(0, 0, 0);
          burstRing.material.opacity = 0;
        } else if (t >= 1.3 && t < 4.5) {
          // Crawling along route to wait position
          const crawlP = clamp((t - 1.3) / 2.8, 0, 1);
          const currentPos = new THREE.Vector3().lerpVectors(route.start, route.wait, crawlP);
          group.position.copy(currentPos);
          group.scale.set(1, 1, 1);

          // Walking leg animation & body wobble
          if (crawlP < 1.0) {
            const legWalk = Math.sin(t * 18 + index * 1.2);
            legs.forEach(({ legRoot, side, order }) => {
              legRoot.rotation.x = legWalk * side * (order === 0 ? -1 : 1) * 0.4;
            });
            group.position.y = route.wait.y + Math.abs(Math.sin(t * 18)) * 0.04;
          } else {
            // Waiting in line
            legs.forEach(({ legRoot }) => { legRoot.rotation.x = 0; });
            group.position.y = route.wait.y;
          }
          burstRing.material.opacity = 0;
        } else if (t >= 4.5 && t < 5.45) {
          // Waiting in line before shield drops
          group.position.copy(route.wait);
          group.scale.set(1, 1, 1);
          burstRing.material.opacity = 0;
        } else if (t >= 5.45 && t <= 6.3) {
          // 5.45–6.3 s: Bots knocked back, flip over and shrink away with white burst ring!
          const knockT = (t - 5.45) / 0.65;
          const s = Math.max(0, 1.0 - knockT);
          group.scale.setScalar(s);
          group.position.x = route.wait.x + knockDir.x * knockT;
          group.position.y = route.wait.y + knockDir.y * knockT;
          group.position.z = route.wait.z + knockDir.z * knockT;
          group.rotation.x += delta * 12;
          group.rotation.z += delta * 10;

          // Burst ring expands
          burstRing.scale.setScalar(1.0 + knockT * 2.5);
          burstRing.material.opacity = Math.max(0, (1.0 - knockT) * 0.8);
        } else {
          group.scale.set(0, 0, 0);
          burstRing.material.opacity = 0;
        }
      });

      // 2.4–5.4 s: RADAR ROTATION, RETICLE TRACKING & LASER
      // Radar rings rotate in opposite directions
      outerRingGroup.rotation.y += delta * 1.4;
      midRingGroup.rotation.y -= delta * 1.8;
      sweepGroup.rotation.y += delta * 2.5;

      // Chasing LEDs around radar rim
      leds.forEach((led, i) => {
        const chase = Math.sin(t * 10 + i * (Math.PI / 4));
        led.material.emissiveIntensity = chase > 0.4 ? 2.5 : 0.2;
      });

      // Reticle tracks bots' coordinates (gliding from one bot to the next)
      if (t >= 2.4 && t <= 5.4) {
        reticleGroup.visible = true;
        laserMesh.visible = true;

        // Determine current target bot
        const trackCycle = ((t - 2.4) / 3.0) * botCount;
        const targetIdx = Math.min(botCount - 1, Math.floor(trackCycle));
        const nextIdx = Math.min(botCount - 1, targetIdx + 1);
        const subT = trackCycle - targetIdx;

        const currentTargetPos = bots[targetIdx].group.position;
        const nextTargetPos = bots[nextIdx].group.position;
        const targetCenter = new THREE.Vector3().lerpVectors(currentTargetPos, nextTargetPos, easeOutBack(clamp(subT * 1.8, 0, 1)));

        reticleGroup.position.set(targetCenter.x, 0.24, targetCenter.z);
        reticleTicksGroup.rotation.y += delta * 4;

        // Laser connects radar head (2.65, 1.09, 0.75) to reticle
        const radarHeadPos = new THREE.Vector3(2.65, 1.09, 0.75);
        const reticleTarget = new THREE.Vector3(targetCenter.x, 0.24, targetCenter.z);

        const laserMid = new THREE.Vector3().addVectors(radarHeadPos, reticleTarget).multiplyScalar(0.5);
        const laserLen = radarHeadPos.distanceTo(reticleTarget);

        laserMesh.position.copy(laserMid);
        laserMesh.scale.z = laserLen;
        laserMesh.lookAt(reticleTarget);

        // Pulse laser and reticle
        const pulse = Math.sin(t * 22) * 0.4 + 0.6;
        matLaserLine.emissiveIntensity = 2.0 + pulse * 2.0;
        reticleRing.scale.setScalar(0.9 + pulse * 0.2);
      } else {
        reticleGroup.visible = false;
        laserMesh.visible = false;
      }

      // 5–5.45 s: HEAVY SHIELD DROPS & SLAMS DOWN WITH DAMPED BOUNCE
      if (t < 5.0) {
        shieldGroup.position.set(-0.35, 12.0, 0.1);
        shockwaves.forEach(sw => sw.material.opacity = 0);
      } else if (t >= 5.0 && t <= 5.45) {
        const dropP = (t - 5.0) / 0.45;
        // Slams down to y = 1.45 with damped bounce
        const targetY = 1.45;
        const currentY = 12.0 - easeOutBounce(dropP) * (12.0 - targetY);
        shieldGroup.position.set(-0.35, currentY, 0.1);

        // Shockwave rings ripple out on impact
        if (dropP > 0.4) {
          const swP = (dropP - 0.4) / 0.6;
          shockwaves.forEach((sw, i) => {
            const sc = 0.5 + (swP + i * 0.3) * 2.2;
            sw.scale.set(sc, sc, sc);
            sw.material.opacity = Math.max(0, (1.0 - swP) * 0.85);
          });
        }
      } else if (t > 5.45 && t < 9.2) {
        shieldGroup.position.set(-0.35, 1.45, 0.1);
        shockwaves.forEach(sw => sw.material.opacity = 0);
      } else {
        // Dismantle phase
        const pOut = clamp((t - 9.2) / 0.8, 0, 1);
        shieldGroup.scale.setScalar(Math.max(0, 1.0 - pOut));
      }

      // 5.45–6.3 s: FIREWALL BRICKS RISE ONE BY ONE
      bricks.forEach(({ mesh, targetY, delay }) => {
        if (t < 5.45 + delay * 0.6) {
          mesh.position.y = -0.4;
          mesh.scale.set(0.2, 0.2, 0.2);
        } else if (t >= 5.45 + delay * 0.6 && t <= 6.5) {
          const riseP = clamp((t - (5.45 + delay * 0.6)) / 0.35, 0, 1);
          mesh.position.y = -0.4 + easeOutBack(riseP, 1.6) * (targetY + 0.4);
          mesh.scale.setScalar(Math.min(1.0, riseP * 1.2));
        } else if (t > 6.5 && t < 9.2) {
          mesh.position.y = targetY;
          mesh.scale.set(1, 1, 1);
        } else {
          // Shrink in reverse
          const pOut = clamp((t - 9.2) / 0.8, 0, 1);
          mesh.scale.setScalar(Math.max(0, 1.0 - pOut));
        }
      });

      // Render Scene
      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();

    // Responsive Canvas Resize logic preserving 9:16 aspect ratio or adaptive embed
    function handleResize() {
      const container = document.getElementById('viewport-stage');
      const rect = container.getBoundingClientRect();
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      if (isEmbedded) {
        const w = Math.floor(rect.width) || 300;
        const h = Math.floor(rect.height) || 165;
        camera.aspect = w / h;
        camera.clearViewOffset();
        camera.fov = (camera.aspect > 1.3) ? 30 : 33;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(w, h, false);
        if (composer) {
          composer.setSize(w, h);
        }
      } else {
        camera.aspect = RENDER_WIDTH / RENDER_HEIGHT;
        camera.setViewOffset(RENDER_WIDTH, RENDER_HEIGHT, 0, -250, RENDER_WIDTH, RENDER_HEIGHT);
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(RENDER_WIDTH, RENDER_HEIGHT, false);
        if (composer) {
          composer.setSize(RENDER_WIDTH, RENDER_HEIGHT);
        }
      }
    }
    window.addEventListener('resize', handleResize);
    setTimeout(handleResize, 20);
  </script>
</body>
